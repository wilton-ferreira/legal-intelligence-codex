name: Plugin e MCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-ubuntu-latest
          path: dist
      - name: Publicar pacote validado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Legal Intelligence Codex $GITHUB_REF_NAME" --generate-notes --verify-tag
